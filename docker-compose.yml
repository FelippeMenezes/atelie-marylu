# Banco de dados para desenvolvimento. Uso: cp .env.example .env (troque a senha) && docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atelie_marylu}
      POSTGRES_USER: ${POSTGRES_USER:-atelie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      # Só aceita conexões da própria máquina
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  dados-postgres:
