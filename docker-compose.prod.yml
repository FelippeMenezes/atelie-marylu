# Produção num único servidor (hoje um VPS Hostinger).
# Uso: cp .env.producao.example .env.producao (preencha) && docker compose -f docker-compose.prod.yml --env-file .env.producao up -d --build
#
# Internet ──443/80──> caddy (HTTPS automático) ──8080──> app (.NET) ──5432──> postgres
# Só o Caddy fica exposto. App e banco são acessíveis apenas pela rede interna do Docker.

name: atelie-marylu

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO no .env.producao}
      DOMINIOS_EXTRAS: ${DOMINIOS_EXTRAS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data        # certificados HTTPS (não perder, senão pede de novo ao Let's Encrypt)
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - interna
    logging: &logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-atelie_marylu};Username=${POSTGRES_USER:-atelie};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Database__ApplyMigrations: "true"
      AllowedHosts: ${DOMINIO}
      # O Caddy fica nesta sub-rede; só dele aceitamos X-Forwarded-For/Proto (IP real e HTTPS)
      Proxy__TrustedNetworks__0: 172.30.0.0/24
      InitialAdmin__Email: ${ADMIN_EMAIL:-}
      InitialAdmin__Password: ${ADMIN_SENHA:-}
      Store__LegalName: ${LOJA_RAZAO_SOCIAL:-}
      Store__TaxDocument: ${LOJA_DOCUMENTO:-}
      Store__Address: ${LOJA_ENDERECO:-}
      Store__ContactEmail: ${LOJA_EMAIL:-}
      Store__Phone: ${LOJA_TELEFONE:-}
      Store__WhatsApp: ${LOJA_WHATSAPP:-}
      GoogleLogin__ClientId: ${GOOGLE_CLIENT_ID:-}
      GoogleLogin__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Turnstile__SiteKey: ${TURNSTILE_SITE_KEY:-}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-}
      # E-mails da conta pelo Resend: sem eles a aplicação não sobe (veja ResendOptions)
      Resend__ApiKey: ${RESEND_API_KEY:?Defina RESEND_API_KEY no .env.producao}
      Resend__From: ${RESEND_FROM:?Defina RESEND_FROM no .env.producao}
      Resend__ReplyTo: ${RESEND_REPLY_TO:-}
      # PagBank: só preencher depois da homologação. Sem token, a loja usa o gateway simulado
      # (e o webhook fica fechado). Com token, PAGBANK_SANDBOX precisa ser false, ou a loja não sobe.
      PagBank__Token: ${PAGBANK_TOKEN:-}
      PagBank__Sandbox: ${PAGBANK_SANDBOX:-false}
      PagBank__PublicBaseUrl: ${PAGBANK_PUBLIC_BASE_URL:-https://www.ateliemarylu.com.br}
    volumes:
      - fotos:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    logging: *logs

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atelie_marylu}
      POSTGRES_USER: ${POSTGRES_USER:-atelie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.producao}
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks:
      - interna
    logging: *logs

networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  banco:
  fotos:
  caddy-dados:
  caddy-config:
